[project]
name = "cgan-celeba"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "tqdm",
  "tensorboard",
  "pytorch-fid",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
